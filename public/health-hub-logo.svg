<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .logo-text { font-family: Arial, sans-serif; font-weight: bold; font-size: 16px; }
    </style>
  </defs>
  
  <!-- Medical Cross -->
  <!-- Vertical bar (black) -->
  <rect x="85" y="40" width="30" height="80" fill="#000000"/>
  <!-- Horizontal bar (blue) -->
  <rect x="60" y="65" width="80" height="30" fill="#0066CC"/>
  
  <!-- Stethoscope -->
  <!-- Main tubing loop -->
  <path d="M 120 50 Q 140 30 160 50 Q 140 70 120 50" 
        stroke="#0066CC" stroke-width="4" fill="none"/>
  
  <!-- Tubing connecting to cross -->
  <path d="M 120 50 Q 110 60 105 70" 
        stroke="#0066CC" stroke-width="4" fill="none"/>
  
  <!-- Chest piece (diaphragm) -->
  <circle cx="110" cy="75" r="8" fill="#000000" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="110" cy="75" r="3" fill="#0066CC"/>
  
  <!-- Text -->
  <text x="100" y="140" text-anchor="middle" class="logo-text" fill="#000000">
    HEALTH-HUB MW
  </text>
</svg>

